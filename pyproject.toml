[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cwa-assembler"
version = "0.0.1"
description = "Reference assembler for the Context Window Architecture (CWA) draft specification"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "referencing>=0.35",
  # Without it, jsonschema silently skips format: date-time (DESIGN.md DA-17).
  "rfc3339-validator>=0.1.4",
]

[project.urls]
Repository = "https://github.com/contextwindowarchitecture/assembler"
Specification = "https://contextwindowarchitecture.io/spec.html"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pytest>=8",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cwa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
