# The suite on every supported Python, and the vendored contract against the website commit it pins. A tag runs
# it through release.yml, on the tagged commit.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to test; release.yml passes the tag
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  contract:
    name: vendored contract matches the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: lock
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("contract.lock.json"))["source"]["commit"])')" >> "$GITHUB_OUTPUT"
      # The locked commit must be pushed to the website repository for this checkout to find it.
      - uses: actions/checkout@v5
        with:
          repository: contextwindowarchitecture/website
          ref: ${{ steps.lock.outputs.commit }}
          path: website
      - run: python3 scripts/vendor_contract.py --spec website --check
